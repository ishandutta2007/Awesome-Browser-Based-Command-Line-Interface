<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.05); }
      }
      @keyframes scanline {
        0% { transform: translateY(-400px); }
        100% { transform: translateY(400px); }
      }
      .cursor { animation: blink 1s infinite; }
      .floating { animation: float 5s ease-in-out infinite; }
      .pulsing { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; fill: #ffffff; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; fill: #94a3b8; }
      .code-text { font-family: 'Fira Code', 'Courier New', monospace; font-weight: 600; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic Background Circles (Behind Content) -->
  <circle cx="150" cy="100" r="180" fill="url(#glow-grad)" class="pulsing"/>
  <circle cx="1050" cy="300" r="220" fill="url(#glow-grad)" class="pulsing" style="animation-delay: -2s;"/>

  <!-- Grid Overlay -->
  <path d="M 0 50 L 1200 50 M 0 100 L 1200 100 M 0 150 L 1200 150 M 0 200 L 1200 200 M 0 250 L 1200 250 M 0 300 L 1200 300 M 0 350 L 1200 350" stroke="#334155" stroke-opacity="0.2" stroke-width="1"/>
  <path d="M 100 0 L 100 400 M 200 0 L 200 400 M 300 0 L 300 400 M 400 0 L 400 400 M 500 0 L 500 400 M 600 0 L 600 400 M 700 0 L 700 400 M 800 0 L 800 400 M 900 0 L 900 400 M 1000 0 L 1000 400 M 1100 0 L 1100 400" stroke="#334155" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Simulated Browser Window Container (Background element) -->
  <g class="floating">
    <rect x="80" y="40" width="1040" height="320" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" fill-opacity="0.8"/>
    <!-- Window Header -->
    <path d="M 80 52 A 12 12 0 0 1 92 40 L 1108 40 A 12 12 0 0 1 1120 52 L 1120 75 L 80 75 Z" fill="#1e293b"/>
    <circle cx="105" cy="57" r="5.5" fill="#ef4444"/>
    <circle cx="123" cy="57" r="5.5" fill="#f59e0b"/>
    <circle cx="141" cy="57" r="5.5" fill="#10b981"/>
    <!-- Address Bar -->
    <rect x="200" y="47" width="800" height="20" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="600" y="61" font-size="11" fill="#64748b" font-family="sans-serif" text-anchor="middle">https://cloud-shell.browser/terminal</text>
  </g>

  <!-- Animated Terminal Command Prompt Decorator -->
  <g font-family="monospace" font-size="14" fill="#38bdf8">
    <text x="110" y="115" class="code-text"><tspan fill="#10b981">user@browser-cli</tspan>:<tspan fill="#818cf8">~/awesome</tspan>$ gh repo view --web</text>
  </g>

  <!-- Main Title & Subtitle (FOREGROUND - Crisp and Unobstructed) -->
  <text x="600" y="185" font-size="38" text-anchor="middle" class="title">Awesome Browser-Based CLI</text>
  
  <text x="600" y="225" font-size="18" text-anchor="middle" class="subtitle">Cloud Shells, Web Terminals &amp; Workspace Streaming Ecosystem</text>

  <!-- Accent Line under Title -->
  <rect x="450" y="242" width="300" height="3" rx="1.5" fill="url(#accent-grad)"/>

  <!-- Pill Tags (Foreground decorative badges) -->
  <g fill="#1e293b" stroke="#475569" stroke-width="1" font-family="sans-serif" font-size="12">
    <!-- Cloud Shells -->
    <rect x="260" y="275" width="160" height="32" rx="16" />
    <text x="340" y="295" fill="#38bdf8" text-anchor="middle" font-weight="600">☁️ Cloud Shells</text>
    
    <!-- Web Terminals -->
    <rect x="440" y="275" width="160" height="32" rx="16" />
    <text x="520" y="295" fill="#a855f7" text-anchor="middle" font-weight="600">💻 Web Terminals</text>

    <!-- Cloud IDEs -->
    <rect x="620" y="275" width="140" height="32" rx="16" />
    <text x="690" y="295" fill="#34d399" text-anchor="middle" font-weight="600">⚡ Cloud IDEs</text>

    <!-- Docker Streaming -->
    <rect x="780" y="275" width="160" height="32" rx="16" />
    <text x="860" y="295" fill="#f43f5e" text-anchor="middle" font-weight="600">🐳 PTY Streaming</text>
  </g>

  <!-- Bottom Command Status Indicator -->
  <g font-family="monospace" font-size="13" fill="#94a3b8">
    <text x="600" y="340" text-anchor="middle">
      <tspan fill="#10b981">✔</tspan> 25+ Curated Platforms &amp; Open-Source Projects <tspan class="cursor" fill="#38bdf8">█</tspan>
    </text>
  </g>
</svg>
